<style>
/* Layout: one game shell — sticky HUD, then a single active screen; map + control panel side by side on wide screens, stacked on phones */
:root{
  color-scheme: dark;
  --bg:#071327; --water:#0A1C38; --surface:#0E2244; --raised:#15305C; --line:#24497C;
  --fg:#E8F1FB; --muted:#94AAC8; --dim:#5F7799;
  --emerald:#1BC690; --emerald-2:#11966C; --emerald-3:#0B6E50;
  --cyan:#3FD9F2; --cyan-soft:rgba(63,217,242,.12);
  --ok:#1BC690; --warn:#F4B64A; --bad:#F06C6C;
  --display:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI","Thonburi",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(ellipse 80% 50% at 70% 0%, rgba(63,217,242,.10), transparent 70%),radial-gradient(ellipse 60% 40% at 0% 100%, rgba(27,198,144,.08), transparent 70%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);
  padding:11px 18px;border-radius:12px;font-family:var(--display);font-weight:600;font-size:15px;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{border-color:var(--cyan)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(180deg,#22D39C,#12a273);border-color:transparent;color:#03231A;box-shadow:0 6px 22px -8px rgba(27,198,144,.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.cyan{background:var(--cyan-soft);border-color:rgba(63,217,242,.5);color:var(--cyan)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,19,39,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.hud-player{display:flex;align-items:center;gap:10px;min-width:0}
.hud-player .av{width:40px;height:40px;flex:none}
.hud-name{font-family:var(--display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.lvl{font-size:12px;color:var(--muted)}
.xpbar{width:90px;height:6px;border-radius:6px;background:var(--water);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--cyan));transition:width .5s}
.chapters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip-ch{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-family:var(--display);font-weight:600;color:var(--muted)}
.chip-ch.done{color:var(--emerald);border-color:rgba(27,198,144,.5)}
.chip-ch.active{background:var(--cyan);color:#04202A;border-color:var(--cyan)}
.chip-ch[disabled]{opacity:.4;cursor:not-allowed}
.demo-pill{font-size:12px;background:rgba(244,182,74,.15);color:var(--warn);border:1px solid rgba(244,182,74,.4);padding:3px 9px;border-radius:999px;white-space:nowrap}
@media (max-width:640px){.chapters{margin-left:0;width:100%}.chip-ch{flex:1;padding:5px 4px}}

main{padding-block:24px 64px}
.screen{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Logo */
.logo{display:flex;align-items:center;gap:12px}
.logo-word{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);letter-spacing:.02em;line-height:1}
.logo-word b{color:var(--cyan);font-weight:700}
.mission-tag{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.2em;border:1px solid var(--emerald);color:var(--emerald);padding:4px 10px;border-radius:6px}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.tagline{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:600;margin-top:18px}
.lead{color:var(--muted);max-width:60ch;margin-top:12px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.city-stage{position:relative}
.city-stage .bubble{position:absolute;left:4%;top:2%;max-width:230px}
.chapters-intro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:36px}
@media (max-width:860px){.chapters-intro{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:rgba(14,34,68,.6)}
.ch-card .n{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--emerald);font-weight:600}
.ch-card h3{font-size:17px;margin-top:4px}
.ch-card p{font-size:13.5px;color:var(--muted);margin-top:6px}

/* mascot */
.mascot-line{display:flex;gap:12px;align-items:flex-start}
.mascot{width:64px;height:64px;flex:none;animation:hover 3.2s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{background:var(--raised);border:1px solid rgba(63,217,242,.35);border-radius:14px;padding:10px 14px;font-size:14px;position:relative}
.bubble b{color:var(--cyan);font-family:var(--display)}

/* map */
.map svg{width:100%;height:auto;display:block}
.tile-top{fill:#167A5C}.tile-l{fill:#0D4E3C}.tile-r{fill:#0A3D30}
.tile-hl .tile-top{fill:#1E9B74}
.tile-ring{fill:none;stroke:var(--cyan);stroke-width:2;opacity:0}
.tile-hl .tile-ring{opacity:1;filter:drop-shadow(0 0 6px var(--cyan))}
.b-top{fill:#4BE3B4}.b-l{fill:#18A97B}.b-r{fill:#0F7C5B}
.b-warn .b-top{fill:#FFD27E}.b-warn .b-l{fill:#D99A2B}.b-warn .b-r{fill:#A9741B}
.b-bad .b-top{fill:#FF9A9A}.b-bad .b-l{fill:#D95454}.b-bad .b-r{fill:#A63B3B}
.win{stroke:rgba(255,255,255,.35);stroke-width:1.4}
.holo{fill:rgba(63,217,242,.07);stroke:var(--cyan);stroke-width:1.3;stroke-dasharray:4 3}
.pad{fill:#2B4A6E}
.tile-num{fill:var(--bg);stroke:var(--cyan);stroke-width:1.2}
.tile-num-t{fill:var(--fg);font:600 10px var(--display);text-anchor:middle;dominant-baseline:central}
.check{fill:var(--emerald)}
.district{cursor:default}
.district.clickable{cursor:pointer}
.district.clickable:hover .tile-top{fill:#1E9B74}
.district:focus{outline:none}.district:focus-visible .tile-ring{opacity:1}
.rise{animation:rise .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:scaleY(.7)}to{transform:none}}
.rise{transform-box:fill-box;transform-origin:50% 100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.holo-sw{border:1.5px dashed var(--cyan);background:var(--cyan-soft)}
.sw.real-sw{background:var(--emerald)}

/* avatar builder */
.avatar-preview{display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar-preview .av{width:min(220px,60vw);height:auto}
.opt-group{display:flex;flex-direction:column;gap:8px}
.opt-label{font-family:var(--display);font-weight:600;font-size:14px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--water);border-radius:10px;padding:7px 12px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-soft);color:var(--cyan)}
.swatch{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.field{width:100%;background:var(--water);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.field:focus{border-color:var(--cyan);outline:none}
textarea.field{min-height:96px;resize:vertical}
.toggle{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--water);text-align:left;width:100%}
.toggle .knob{width:40px;height:22px;border-radius:22px;background:var(--line);flex:none;position:relative;transition:background .2s;margin-top:2px}
.toggle .knob::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--fg);top:3px;left:3px;transition:left .2s}
.toggle[aria-pressed="true"] .knob{background:var(--emerald)}
.toggle[aria-pressed="true"] .knob::after{left:21px}
.err{color:var(--bad);font-size:13.5px}

/* chapter header */
.ch-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.ch-head h2{font-size:clamp(24px,3.4vw,32px)}
.ch-head p{color:var(--muted);max-width:64ch}

/* dream builder */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step-dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--water);font:600 12px var(--display);color:var(--muted)}
.step-dot.set{border-color:rgba(27,198,144,.6);color:var(--emerald)}
.step-dot.cur{background:var(--cyan);border-color:var(--cyan);color:#04202A}
.dist-title{font-size:22px}
.dist-sub{color:var(--muted);font-size:13.5px}
.q-ideal{font-size:17px;font-weight:500;margin-top:6px}
.slider-box{background:var(--water);border:1px solid var(--line);border-radius:12px;padding:18px 16px 12px}
.slider-read{display:flex;align-items:baseline;gap:10px}
.slider-read .big{font:700 44px var(--display);color:var(--cyan);line-height:1}
.slider-read .lab{font-family:var(--display);font-weight:600;font-size:17px}
input[type=range]{width:100%;margin:14px 0 4px;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;
  background:linear-gradient(90deg,var(--emerald) 0,var(--cyan) var(--p,50%),var(--line) var(--p,50%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--fg);border:4px solid var(--cyan);box-shadow:0 0 12px rgba(63,217,242,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:4px solid var(--cyan)}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.ticks span{width:20%;text-align:center}
.ticks span:first-child{text-align:left}.ticks span:last-child{text-align:right}

/* reality hub */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-stat{background:var(--water);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini-stat .k{font-size:12.5px;color:var(--muted)}
.mini-stat .v{font:700 22px var(--display)}
.mini-stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.dist-list{display:flex;flex-direction:column;gap:8px}
.dist-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);
  background:var(--water);border-radius:12px;padding:10px 12px;transition:border-color .15s,transform .15s}
.dist-item:hover{border-color:var(--cyan);transform:translateX(2px)}
.dist-item .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--display);border:1px solid var(--cyan);color:var(--cyan)}
.dist-item .nm{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.3}
.dist-item .sub{font-size:12.5px;color:var(--muted)}
.status{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.done{color:var(--emerald);border-color:rgba(27,198,144,.5);background:rgba(27,198,144,.1)}
.status.part{color:var(--cyan);border-color:rgba(63,217,242,.5)}

/* mission card */
.mission{max-width:720px;margin:0 auto}
.scenario{border-left:3px solid var(--warn);background:rgba(244,182,74,.08);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.scenario b{color:var(--warn);font-family:var(--display)}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.pips i.on{background:var(--emerald)}.pips i.cur{background:var(--cyan)}
.item-text{font-family:var(--display);font-size:clamp(19px,2.6vw,24px);font-weight:600;line-height:1.4;min-height:3em}
.answers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{border:1px solid var(--line);background:var(--water);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.ans .d{font:700 20px var(--display);color:var(--cyan)}
.ans .t{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.ans:hover{border-color:var(--cyan);background:var(--cyan-soft)}
.ans[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan)}
.ans[aria-pressed="true"] .d,.ans[aria-pressed="true"] .t{color:#04202A}
@media (max-width:560px){.ans{flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 14px}.ans .d{width:20px}}

/* gap analysis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font:700 30px var(--display);line-height:1.15;margin-top:2px}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12.5px;margin-top:2px}
.dumb{display:flex;flex-direction:column;gap:2px}
.dumb-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(36,73,124,.5)}
.dumb-row:last-child{border-bottom:0}
.dumb-row .lb{font-size:13.5px;font-weight:500;line-height:1.3}
.dumb-row .lb small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.track{position:relative;height:22px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.track .grid{position:absolute;top:3px;bottom:3px;width:1px;background:rgba(36,73,124,.6)}
.track .seg{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:4px}
.track .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%)}
.track .dot.ideal{border:2.5px solid var(--cyan);background:var(--bg)}
.gapv{font:700 15px var(--display);text-align:right}
.axis{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:12px;font-size:11px;color:var(--muted)}
.axis .scale{position:relative;height:14px}
.axis .scale span{position:absolute;transform:translateX(-50%)}
@media (max-width:560px){.dumb-row,.axis{grid-template-columns:minmax(0,96px) minmax(0,1fr) 48px;gap:8px}}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
.prio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.prio{grid-template-columns:minmax(0,1fr)}}
.prio-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);border-top:3px solid var(--line)}
.prio-card.k-bad{border-top-color:var(--bad)}.prio-card.k-warn{border-top-color:var(--warn)}.prio-card.k-ok{border-top-color:var(--ok)}
.prio-card .rank{font:600 12px var(--display);letter-spacing:.12em;color:var(--muted)}
.prio-card h3{font-size:17px;margin-top:2px}
.prio-card p{font-size:13.5px;color:var(--muted);margin-top:6px}
.howread{font-size:13.5px;color:var(--muted)}
.howread table{border-collapse:collapse;width:100%;margin-top:8px}
.howread td,.howread th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.howread th{color:var(--fg);font-family:var(--display);font-weight:600}
.tbl-wrap{overflow-x:auto}

/* ideas */
.idea-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:10px}
.idea-card h3{font-size:18px}
.starters{display:flex;gap:6px;flex-wrap:wrap}
.starter{font-size:12.5px;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;color:var(--muted)}
.starter:hover{color:var(--cyan);border-color:var(--cyan)}
.stars{display:flex;gap:3px}
.stars svg{width:18px;height:18px}
.star-on{fill:var(--warn)}.star-off{fill:var(--line)}
.idea-result{display:flex;align-items:center;gap:10px;font-size:13.5px}

/* report */

/* ---------- unit code (10 digits) and completion progress ---------- */
const BOSS=['หัวหน้าชุด','หัวหน้าผู้ควบคุมงาน','ผู้ช่วยผู้จัดการหน่วยงาน','ผู้จัดการหน่วยงาน','Operation Executive','Operation Manager'];
const unitDigits=v=>String(v==null?'':v).replace(/\D/g,'').slice(0,10);
const fmtUnit=c=>c&&c.length===10?`${c.slice(0,3)}-${c.slice(3,5)}-${c.slice(5,8)}-${c.slice(8)}`:c;
const fmtUnitTyping=c=>[c.slice(0,3),c.slice(3,5),c.slice(5,8),c.slice(8,10)].filter(Boolean).join('-');
let UNIT_API=null,UNITS=UNITS_EMBED.slice(),UNIT_Q=0;
try{const u=JSON.parse(localStorage.getItem('ic-units-local')||'null');if(Array.isArray(u)&&u.length)UNITS=u;}catch(e){}
function localSearch(prefix){const L=(UNITS||[]).filter(u=>u.c.startsWith(prefix));return{total:L.length,units:L.slice(0,8).map(u=>[u.c,u.n])};}
const UNIT_HINT='ดูรหัสได้จากหัวหน้างานหรือฝ่ายบุคคล เช่น 701-10-033-00';
function unitOutHTML(){const p=S.profile,c=unitDigits(p.unitCode);
  if(p.unitOk===false)return['bad','ไม่พบรหัสนี้ ตรวจสอบอีกครั้ง'];
  if(c.length===10&&p.unitName)return['ok','พบ: '+p.unitName];
  if(c.length===10&&p.unitOk)return['ok','รหัส '+fmtUnit(c)];
  return['',c.length?`พิมพ์อีก ${10-c.length} หลัก`:UNIT_HINT];}
function paintUnit(){const o=document.getElementById('unitOut');if(!o)return;const [k,t]=unitOutHTML();o.textContent=t;o.className='unit-out'+(k?' '+k:'');}
let SUG_T=null,SUG_Q=0;
function clearSug(){clearTimeout(SUG_T);SUG_Q++;const el=document.getElementById('unitSug');if(el){el.innerHTML='';el.hidden=true;}}
function suggestUnits(prefix){clearTimeout(SUG_T);const loc=UNITS&&UNITS.length;if((!loc&&!(UNIT_API&&UNIT_API.search))||prefix.length<3){clearSug();return;}
  SUG_T=setTimeout(async()=>{const q=++SUG_Q;let r;try{r=loc?localSearch(prefix):await UNIT_API.search(prefix);}catch(e){return;}
    if(q!==SUG_Q)return;const el=document.getElementById('unitSug');if(!el)return;const L=(r&&r.units)||[];
    if(!L.length){el.innerHTML='<p class="sug-note">ไม่พบหน่วยงานที่ขึ้นต้นด้วย '+esc(fmtUnitTyping(prefix))+'</p>';el.hidden=false;return;}
    el.innerHTML=L.map(u=>`<button type="button" class="sug-item" data-action="pickUnit" data-c="${esc(u[0])}" data-n="${esc(u[1])}"><span class="tnum">${esc(fmtUnit(u[0]))}</span><span>${esc(u[1])}</span></button>`).join('')
      +(r.total>L.length?`<p class="sug-note">พบ ${r.total} หน่วยงาน แสดง ${L.length} รายการแรก พิมพ์ต่อเพื่อกรองให้แคบลง</p>`:'');el.hidden=false;},loc?0:220);}
function pickUnit(c,n){const p=S.profile;UNIT_Q++;p.unitCode=unitDigits(c);p.unitName=String(n||'').slice(0,120);p.unitOk=true;
  const i=document.getElementById('pf_unit');if(i)i.value=fmtUnitTyping(p.unitCode);clearSug();paintUnit();save();
  const g=document.getElementById('pfg_unitCode');if(g)g.classList.remove('need');}
async function checkUnit(){const p=S.profile,c=unitDigits(p.unitCode);p.unitName='';p.unitOk=null;
  if(c.length<10){paintUnit();save();suggestUnits(c);return;}
  if(UNITS&&UNITS.length){const u=UNITS.find(x=>x.c===c);UNIT_Q++;if(u){p.unitOk=true;p.unitName=String(u.n||'').slice(0,120);clearSug();}else{p.unitOk=false;suggestUnits(c.slice(0,5));}
    paintUnit();save();const g=document.getElementById('pfg_unitCode');if(g&&p.unitOk)g.classList.remove('need');return;}
  if(!UNIT_API){p.unitOk=true;paintUnit();save();return;}
  const q=++UNIT_Q,o=document.getElementById('unitOut');if(o){o.textContent='กำลังตรวจรหัส…';o.className='unit-out';}
  try{const r=await UNIT_API.lookup(c);if(q!==UNIT_Q)return;
    if(!r.loaded)p.unitOk=true;else if(r.found){p.unitOk=true;p.unitName=String(r.name||'').slice(0,120);}else p.unitOk=false;
    if(p.unitOk===false)suggestUnits(c.slice(0,5));else clearSug();}

function csvRows(t){const out=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];

    const wb=X.read(await file.arrayBuffer(),{type:'array'});tables=wb.SheetNames.map(n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));}
  for(const T of tables){for(let i=0;i<Math.min(T.length,20);i++){const H=(T[i]||[]).map(x=>String(x).trim());
    const ci=H.findIndex(h=>/^(รหัสหน่วยงาน|unit_?code)$/i.test(h));if(ci<0)continue;
    const ni=H.findIndex(h=>/^(สังกัดหน่วยงาน|หน่วยงาน|ชื่อหน่วยงาน|unit_?name)$/i.test(h)),di=H.findIndex(h=>/^(ฝ่าย|division)$/i.test(h)),hi=H.findIndex(h=>/^(จำนวนพนักงาน|headcount)$/i.test(h));

      if(ni>=0&&!u.n)u.n=String(row[ni]||'').replace(/^\s*[\d-]+\s+/,'').trim().slice(0,120);

const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const answered=d=>S.answers[d].filter(v=>v!=null).length;
const distDone=d=>answered(d)===DIMS[d].items.length;
const allReal=()=>DIMS.every((_,d)=>distDone(d));
function realMean(d){if(!distDone(d))return null;return avg(S.answers[d].map((v,i)=>DIMS[d].items[i][1]?6-v:v));}
function priority(d){const r=realMean(d);return r==null?-9:5-r;}
function satLevel(m){if(m<=2.33)return{k:'bad',t:'ไม่พึงพอใจ'};if(m<=3.66)return{k:'warn',t:'พึงพอใจปานกลาง'};return{k:'ok',t:'พึงพอใจ'};}
function rateIdea(t){t=(t||'').trim();if(t.length<8)return 0;let s=1;if(t.length>=40)s++;if(t.length>=90)s++;
  if(/ควร|จัด|เพิ่ม|ลด|ปรับ|สร้าง|อบรม|ประชุม|ระบบ|กำหนด|เปิด|ให้มี|แผน|ทำ/.test(t))s++;
  if(/\d|ทุก|ครั้ง|สัปดาห์|เดือน|ไตรมาส|ปีละ|วัดผล|ประเมิน|ติดตาม|ตัวชี้วัด|เป้าหมาย|%/.test(t))s++;return s;}
function topDims(){return DIMS.map((_,d)=>d).sort((a,b)=>priority(b)-priority(a)).slice(0,3);}
function xp(){let x=0;
  S.answers.forEach((a,d)=>{x+=a.filter(v=>v!=null).length*10;if(distDone(d))x+=30});
  Object.values(S.ideas).forEach(i=>{x+=(i.stars||0)*30});if(S.sawGap)x+=50;if(S.finished)x+=100;return x;}

const FH=20,SLAB=15,BASEY=236,TOPY=BASEY-10-ND*FH-58;
const wOf=v=>22+v*11;
function isoPts(cx,cy,w,h){const q=w/2;return{L:`${cx-w},${cy} ${cx},${cy+q} ${cx},${cy+q-h} ${cx-w},${cy-h}`,R:`${cx},${cy+q} ${cx+w},${cy} ${cx+w},${cy-h} ${cx},${cy+q-h}`,T:`${cx},${cy-q-h} ${cx+w},${cy-h} ${cx},${cy+q-h} ${cx-w},${cy-h}`,q};}
function floorSolid(cx,cy,w,cls,anim){const P=isoPts(cx,cy,w,SLAB);let win='';for(let x=0.18;x<0.95;x+=0.2){win+=`<line class="win" x1="${cx-w+w*x}" y1="${cy-SLAB*0.5+P.q*x}" x2="${cx-w+w*x}" y2="${cy-SLAB*0.5+P.q*x-6}"/><line class="win" x1="${cx+w*x}" y1="${cy+P.q-SLAB*0.5-P.q*x}" x2="${cx+w*x}" y2="${cy+P.q-SLAB*0.5-P.q*x-6}"/>`;}
  return `<g class="${cls}${anim?' grow':''}"><polygon class="b-l" points="${P.L}"/><polygon class="b-r" points="${P.R}"/><polygon class="b-top" points="${P.T}"/>${win}</g>`;}
function floorShell(cx,cy,w){const P=isoPts(cx,cy,w,SLAB),q=P.q;
  return `<g><polygon class="holo" points="${cx-w},${cy} ${cx},${cy+q} ${cx+w},${cy} ${cx+w},${cy-SLAB} ${cx},${cy-q-SLAB} ${cx-w},${cy-SLAB}"/><path class="holo" style="fill:none" d="M${cx-w} ${cy-SLAB} L${cx} ${cy+q-SLAB} L${cx+w} ${cy-SLAB} M${cx} ${cy+q-SLAB} L${cx} ${cy+q}"/></g>`;}
function mapSVG(o){const cx=0;let s='';
  const isl=isoPts(cx,BASEY,104,10);
  s+=`<polygon class="tile-l" points="${isl.L}"/><polygon class="tile-r" points="${isl.R}"/><polygon class="tile-top" points="${isl.T}"/>`;
  s+=`<polygon class="core" points="${isoPts(cx,BASEY-10,16,FH*ND+4).L}"/><polygon class="core core-r" points="${isoPts(cx,BASEY-10,16,FH*ND+4).R}"/>`;
  for(let k=0;k<ND;k++){const cy=BASEY-10-k*FH,iv=o.ideal?o.ideal[k]:null,rv=o.real?o.real[k]:null;
    const tint=o.tint&&o.tint[k]?' b-'+o.tint[k]:'',an=o.anim===k,hl=o.hl===k;
    const plate=isoPts(cx,cy,26,3);s+=`<g class="floor${hl?' floor-hl':''}" data-d="${k}">`;
    s+=`<polygon class="plate" points="${plate.T}"/>`;
    if(rv!=null)s+=floorSolid(cx,cy,wOf(rv),tint.trim(),an);
    if(iv!=null)s+=floorShell(cx,cy,wOf(iv));
    const ly=cy-SLAB/2+2;s+=`<line class="lead" x1="${cx+82}" y1="${ly}" x2="${cx+112}" y2="${ly}"/><circle class="tile-num" cx="${cx+124}" cy="${ly}" r="10"/><g class="ico" transform="translate(${cx+117} ${ly-7}) scale(.5833)">${ICONS[k]}</g><text class="floor-t" x="${cx+140}" y="${ly+0.5}">${k+1} ${DIMS[k].th}</text>`;
    s+=`</g>`;}

const FLAT=[];DIMS.forEach((D,d)=>D.items.forEach((_,i)=>FLAT.push([d,i])));
function validOrder(o){return Array.isArray(o)&&o.length===NT&&new Set(o).size===NT&&o.every(x=>Number.isInteger(x)&&x>=0&&x<NT);}
function shuffleOrder(){const a=FLAT.map((_,k)=>k);
  for(let t=0;t<500;t++){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}
    if(a.every((x,k)=>!k||FLAT[x][0]!==FLAT[a[k-1]][0]))return a.slice();}
  return ORDER.map(([d,i])=>IX(d,i));}
function ordAt(p){if(!validOrder(S.order)){S.order=shuffleOrder();save();}return FLAT[S.order[p]];}

function fnv(t){let h=2166136261;for(const ch of t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h.toString(16);}
async function checkCode(code){const t='wt9:'+code.trim();
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===ADMIN_HASH;}}catch(e){}
  return fnv(t)===ADMIN_FNV;}

function keyCsv(){const q=v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};const pos={};ORDER.forEach(([d,i],p)=>pos[IX(d,i)]=p+1);
  const L=[['part','code','game_order','dimension','dimension_en','text','direction'].join(',')];
  DIMS.forEach((D,d)=>D.items.forEach((it,i)=>L.push(['reality',IX(d,i)+1,pos[IX(d,i)],D.th,D.en,it[0],it[1]?'reverse':'positive'].map(q).join(','))));
  return '﻿'+L.join('\n');}
async function saveFile(name,text,mime){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(dl){try{await dl.save({filename:name,data:new Blob([text],{type:mime})});toast('ส่งไฟล์ให้ดาวน์โหลดแล้ว');return;}catch(e){if(e&&e.code==='declined')return;}}
  if(!window.claude){try{const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('ดาวน์โหลดแล้ว');return;}catch(e){}}
  STATS.csv=text.replace(/^﻿/,'');render();const b=document.getElementById('csvBox');if(b){b.focus();b.select();}toast('ดาวน์โหลดไม่ได้ในหน้านี้ เลือกข้อความไว้ให้คัดลอกแล้ว');}
function dl(k){const all=STATS.rows.filter(usableRow),stamp=new Date().toISOString().slice(0,10);
  if(k==='csv')return saveFile(`ideal-company-results-${stamp}.csv`,csvText(all),'text/csv;charset=utf-8');
  if(k==='progress')return saveFile(`ideal-company-progress-${stamp}.csv`,progressCsv(),'text/csv;charset=utf-8');
  if(k==='spoiled')return saveFile(`ideal-company-spoiled-${stamp}.csv`,csvText(spoiledRows()),'text/csv;charset=utf-8');
  if(k==='json')return saveFile(`ideal-company-raw-${stamp}.json`,JSON.stringify(STATS.rows.filter(validRow).map(r=>Object.assign({},r,{quality:isStraight(r)?'spoiled':'ok'})).map(({id,...r},n)=>Object.assign({respondent:'R'+String(n+1).padStart(3,'0')},r)),null,2),'application/json');
  return saveFile('ideal-company-question-key.csv',keyCsv(),'text/csv;charset=utf-8');}

function resultCode(){const r=buildRecord();const c=[r.v,r.at,(ORGS.indexOf(r.org)>=0?ORGS.indexOf(r.org):r.org),AGES.indexOf(r.age),STATUSES.indexOf(r.status),r.sim?1:0,'',r.items.join(''),r.ideas.map(i=>[i.d,i.stars,i.text]),r.extra,r.xp,DEMOG_KEYS.map(k=>r[k]==null?'':r[k])];
  const body=b64e(JSON.stringify(c));return 'WT9-'+body+'-'+fnv(body);}
function parseCode(code){const m=/WT9-([A-Za-z0-9_-]+)-([0-9a-f]+)/.exec(code||'');if(!m||fnv(m[1])!==m[2])return null;
  try{const c=JSON.parse(b64d(m[1]));const digits=x=>String(x).split('').map(Number);
    const r={v:c[0]|0,at:String(c[1]||''),org:typeof c[2]==='string'?c[2].slice(0,80):(ORGS[c[2]]||''),age:AGES[c[3]]||'',status:STATUSES[c[4]]||'',sim:c[5]===1,items:digits(c[7]),
      ideas:(Array.isArray(c[8])?c[8]:[]).slice(0,ND).map(i=>({d:i[0]|0,stars:Math.min(5,Math.max(0,i[1]|0)),text:String(i[2]||'').slice(0,500)})),extra:String(c[9]||'').slice(0,500),xp:c[10]|0,via:'code'};
    if(Array.isArray(c[11]))DEMOG_KEYS.forEach((k,i)=>{const v=c[11][i];r[k]=k==='ageYears'?(parseInt(v,10)||null):String(v==null?'':v).slice(0,80);});
    if(!validRow(r))return null;r.persona='';return{r,id:'code-'+m[2]};}catch(e){return null;}}
function codeBlock(){const c=resultCode();return `<div class="code-box"><p><b style="font-family:var(--display)">ส่งผลด้วยรหัสผลลัพธ์</b><br><span class="muted">ระบบส่งผลอัตโนมัติจากเครื่องนี้ไม่ได้ คัดลอกรหัสด้านล่างแล้วส่งให้ผู้จัดกิจกรรม เช่น ทางแชตหรืออีเมล รหัสนี้ไม่มีชื่อหรือข้อมูลระบุตัวตน</span></p>
  <textarea id="resCode" class="field" readonly aria-label="รหัสผลลัพธ์">${c}</textarea><div class="row"><button class="btn sm primary" data-action="copyCode">คัดลอกรหัสผลลัพธ์</button><button class="btn sm ghost" data-action="resubmit">ลองส่งอัตโนมัติอีกครั้ง</button></div></div>`;}
function copyCode(){const b=document.getElementById('resCode');if(!b)return;const t=b.value;const fb=()=>{b.focus();b.select();toast('เลือกรหัสแล้ว กดคัดลอกได้เลย');};
  try{navigator.clipboard.writeText(t).then(()=>toast('คัดลอกรหัสผลลัพธ์แล้ว'),fb);}catch(e){fb();}}
let IMP={busy:false,msg:''};
async function importCodes(){const ta=document.getElementById('impBox');if(!ta||!DB||IMP.busy)return;const raw=ta.value;
  const found=raw.match(/WT9-[A-Za-z0-9_-]+-[0-9a-f]+/g)||[];if(!found.length){IMP.msg='<span class="c-bad">ไม่พบรหัสผลลัพธ์ในข้อความ รหัสขึ้นต้นด้วย WT9-</span>';return render();}
  IMP={busy:true,msg:'กำลังนำเข้า…'};render();let ok=0,bad=0,dup=0,fail=0;const seen=new Set(STATS.rows.map(r=>r.id));
  for(const c of found){const p=parseCode(c);if(!p){bad++;continue;}if(seen.has(p.id)){dup++;continue;}
    try{await DB.doc('responses/'+p.id).set(p.r);seen.add(p.id);ok++;}catch(e){fail++;}}
  IMP={busy:false,msg:`<span class="${ok?'c-ok':'c-warn'}">นำเข้าแล้ว ${ok} รายการ</span>${dup?` · ซ้ำกับที่มีอยู่ ${dup}`:''}${bad?` · <span class="c-bad">รหัสไม่ถูกต้อง ${bad}</span>`:''}${fail?` · <span class="c-bad">บันทึกไม่สำเร็จ ${fail}</span>`:''}`};
  if(ok)ta.value='';render();}
function importPanel(){return `<div class="panel stack" style="margin-bottom:16px"><div><h3 style="font-size:18px">นำเข้ารหัสผลลัพธ์</h3><p class="muted" style="font-size:13.5px;margin-top:4px">สำหรับผู้เล่นที่ส่งผลอัตโนมัติไม่ได้ เช่น คนนอกองค์กรที่เปิดผ่านลิงก์ วางรหัสได้หลายรหัสพร้อมกัน ระบบตรวจรหัสเสีย และข้ามรหัสที่นำเข้าแล้ว</p></div>
  <textarea id="impBox" class="field" placeholder="วางรหัสที่ขึ้นต้นด้วย WT9- ที่นี่" style="min-height:90px;font-size:12px"></textarea>
  <div class="row" style="justify-content:space-between"><span style="font-size:13.5px">${IMP.msg}</span><button class="btn sm primary" data-action="importCodes" ${IMP.busy?'disabled':''}>นำเข้า</button></div></div>`;}

let ADMIN_PASS='';try{ADMIN_PASS=sessionStorage.getItem('ic-admin-pass')||'';}catch(e){}
function localUid(){let id='';try{id=localStorage.getItem('ic-player-id')||'';}catch(e){}
  if(!/^p-[a-z0-9]{20,}$/.test(id)){const a=new Uint8Array(16);(crypto&&crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0));
    id='p-'+[...a].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,26);try{localStorage.setItem('ic-player-id',id);}catch(e){}}return id;}
async function api(method,payload){const url=activeEndpoint();let r;
  if(method==='GET'){r=await fetch(url+'?'+new URLSearchParams(payload).toString(),{method:'GET'});}
  else{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});}
  const j=await r.json();if(!j.ok){const e=new Error(j.error||'error');e.code=j.error==='unauthorized'?'unauthorized':'unavailable';throw e;}return j;}
function makeSheetDB(){const listeners=new Set();let timer=null,last=[];
  UNIT_API={lookup:c=>api('GET',{action:'unit',code:c}),search:q=>api('GET',{action:'units_search',q}),save:u=>api('POST',{action:'units',code:ADMIN_PASS,units:u.map(x=>[x.c,x.n,x.d,x.h])})};
  async function pull(){try{const j=await api('GET',{action:'list',code:ADMIN_PASS});last=j.rows||[];if(Array.isArray(j.units)&&j.units.length)UNITS=j.units.map(u=>({c:String(u[0]),n:String(u[1]||''),d:String(u[2]||''),h:+u[3]||0}));
      const snap={docs:last.map(r=>({id:r.id,exists:true,data:()=>r.data}))};listeners.forEach(l=>l.ok(snap));}
    catch(e){listeners.forEach(l=>l.err&&l.err({code:e.code||'unavailable'}));}}
  return{doc(path){const id=path.split('/')[1];return{
      set:async data=>{await api('POST',{action:'save',id,data});},
      delete:async()=>{await api('POST',{action:'delete',ids:[id],code:ADMIN_PASS});clearTimeout(timer);timer=setTimeout(()=>{pull();timer=null;poll();},400);}}},
    collection(){return{limit(){return{onSnapshot(ok,err){const l={ok,err};listeners.add(l);pull();poll();return()=>{listeners.delete(l);};}}}}}};
  function poll(){if(timer)return;timer=setTimeout(function t(){timer=null;if(listeners.size&&ADMIN_OK){pull();poll();}},30000);}}

/* ---------- where results live on the standalone website ---------- */
let LOCAL_ONLY=false;
function savedEndpoint(){try{return localStorage.getItem('ic-endpoint')||'';}catch(e){return '';}}
function activeEndpoint(){return SITE_CONFIG.ENDPOINT||savedEndpoint();}
function makeLocalDB(){const KEY='ic-local-responses-16',listeners=new Set();
  const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}};
  const write=o=>{try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){const er=new Error('quota');er.code='quota_exceeded';throw er;}};
  const emit=()=>{const o=read(),snap={docs:Object.entries(o).map(([id,d])=>({id,exists:true,data:()=>d}))};listeners.forEach(l=>l(snap));};
  return{doc(path){const id=path.split('/')[1];return{set:async d=>{const o=read();o[id]=d;write(o);emit();},delete:async()=>{const o=read();delete o[id];write(o);emit();}}},
    collection(){return{limit(){return{onSnapshot(ok){listeners.add(ok);setTimeout(emit,0);return()=>listeners.delete(ok);}}}}}};}
function adminNote(){if(window.claude)return DB?'ทุกเครื่องที่ใส่รหัสถูกต้องดูและจัดการข้อมูลได้':'<span class="c-warn">ยังเชื่อมต่อระบบเก็บผลไม่ได้</span>';
  if(SITE_CONFIG.ENDPOINT)return '<span class="c-ok">เชื่อมต่อ Google Sheets แล้ว ผู้เล่นทุกคนส่งผลอัตโนมัติ</span>';
  if(savedEndpoint())return '<span class="c-warn">เครื่องนี้อ่านผลจาก Google Sheets ได้ แต่ผู้เล่นยังส่งผลอัตโนมัติไม่ได้ จนกว่าจะใส่ URL ใน index.html</span>';
  return '<span class="c-warn">โหมดในเครื่อง: ผู้เล่นจะได้รหัสผลลัพธ์ นำรหัสมาวางในแท็บ "จัดการข้อมูล" ผลจะเก็บในเบราว์เซอร์นี้เท่านั้น</span>';}
function connectPanel(){if(window.claude)return '';const cur=activeEndpoint();
  return `<div class="panel stack" style="margin-bottom:16px"><div><h3 style="font-size:18px">เชื่อมต่อ Google Sheets</h3><p class="muted" style="font-size:13.5px;margin-top:4px">วาง Web app URL ของ Apps Script ที่ลงท้ายด้วย <code>/exec</code> หน้านี้จะอ่านผลจาก Google Sheet ได้ทันที ถ้าต้องการให้ผู้เล่นส่งผลอัตโนมัติด้วย ต้องใส่ URL เดียวกันใน <code>SITE_CONFIG</code> ของไฟล์ index.html</p></div>
   ${SITE_CONFIG.ENDPOINT?`<p class="c-ok" style="font-size:13.5px">ไฟล์เว็บมี URL แล้ว: <code style="word-break:break-all">${esc(SITE_CONFIG.ENDPOINT)}</code></p>`:`
   <input id="epBox" class="field" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(savedEndpoint())}" autocomplete="off">
   <div class="row" style="justify-content:space-between"><span id="epMsg" style="font-size:13.5px">${cur?'<span class="c-ok">บันทึก URL ไว้ในเครื่องนี้แล้ว</span>':''}</span><div class="row">${savedEndpoint()?'<button class="btn sm ghost" data-action="epClear">ลบ URL</button>':''}<button class="btn sm primary" data-action="epSave">บันทึกและทดสอบ</button></div></div>`}</div>`;}

  catch(e){msg.innerHTML='<span class="c-bad">เชื่อมต่อไม่ได้ ตรวจว่า Deploy เป็น Web app และตั้ง Who has access เป็น Anyone</span>';}}

const IOP=[

  acts:['อบรมหัวหน้างานด้านการรับฟังเชิงรุก การให้ feedback และการตัดสินใจอย่างมีเหตุผล','กำหนดการพูดคุยตัวต่อตัว (one-on-one) กับลูกทีมทุกคนอย่างน้อยเดือนละครั้ง','ใช้เกณฑ์มอบหมายงานและประเมินผลที่เปิดเผย และประเมินหัวหน้าแบบ 360 องศา']},
 {theory:'แบบจำลองความต้องการ–ทรัพยากรในงาน (Job Demands–Resources: JD-R)',why:'อุปกรณ์เป็นทรัพยากรในงาน (job resource) โดยตรง เมื่อขาดหรือไม่พร้อมใช้ พนักงานต้องใช้แรงชดเชยมากขึ้น เกิดความเครียดและความเหนื่อยล้า และผลงานลดลง',

  acts:['กำหนดช่องทางประกาศหลักช่องทางเดียว เพื่อลดข้อมูลที่ขัดกัน','ใช้แบบฟอร์มสรุปส่งต่องานทุกครั้งที่เปลี่ยนกะหรือส่งงานข้ามแผนก','ระบุผู้ติดต่อของแต่ละเรื่อง และให้หัวหน้าตรวจสอบความเข้าใจหลังมอบหมายงาน']},

  acts:['ประกาศตารางกะล่วงหน้าอย่างน้อย 2 สัปดาห์ และกำหนดเงื่อนไขการเปลี่ยนกะที่ชัดเจน','ใช้ระบบขอลาและสลับกะออนไลน์ที่โปร่งใส อนุมัติตามสิทธิโดยไม่ต้องเจรจา','สื่อสารกับหัวหน้างานว่าการใช้สิทธิลาตามระเบียบเป็นเรื่องปกติ และติดตามข้อร้องเรียน']},

function render(){avId=0;const map={home:homeScr,avatar:avatarScr,ch2:ch2Scr,mission:missionScr,ch3:ch3Scr,ch4:ch4Scr,report:reportScr,stats:statsScr};
  app.innerHTML=hud()+(map[S.screen]||homeScr)();S._anim=null;save();}
function go(s){if(s==='ch3'&&allReal())S.sawGap=S.sawGap||true;S.screen=s;withXP(()=>{});window.scrollTo({top:0,behavior:'smooth'});}
let toastT;function toast(html){const t=document.getElementById('toast');t.innerHTML=html;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}
function withXP(fn,msg){const before=xp();fn();const gain=xp()-before;render();if(gain>0||msg)toast(`${msg||''}${gain>0?` <span class="xp">+${gain} XP</span>`:''}`);}

function modal(html){const r=document.getElementById('modalRoot');r.innerHTML=`<div class="modal" data-action="closeModal"><div class="modal-box" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function howto(){modal(`<h2>วิธีเล่น Ideal Company</h2><div class="mascot-line">${mascotSVG()}<p class="muted">คุณคือ “นักออกแบบอนาคตขององค์กร” ร่วมกันสร้างตึก 16 ชั้นของ Ideal Company ซึ่งแทนความพึงพอใจในงาน 16 ด้าน ประยุกต์จากกรอบ Job Satisfaction Survey (JSS) ใช้เวลาประมาณ 10 นาที</p></div>
 <ol><li><b>ข้อมูลผู้เล่น</b> กรอกข้อมูลพื้นฐาน บริษัท และตำแหน่ง ถ้ายังไม่มีประสบการณ์ทำงาน เปิดโหมดบริษัทจำลอง</li>
 <li><b>บทที่ 1 Reality Quest</b> ตอบภารกิจ 32 ข้อต่อเนื่องกันว่าข้อความจริงกับบริษัทของคุณแค่ไหน พักแล้วกลับมาตอบต่อได้</li>
 <li><b>บทที่ 2 Satisfaction Scanner</b> ดูตึกว่าชั้นไหนแข็งแรง ชั้นไหนต้องเสริม และ 3 ชั้นที่ควรพัฒนาก่อน</li>
 <li><b>บทที่ 3 Change Maker</b> เสนอไอเดียพัฒนา ไอเดียที่บอกว่าจะทำอะไรและทำบ่อยแค่ไหนได้ดาวและ XP มากกว่า</li></ol>
 <p class="muted" style="font-size:13px">ไม่มีคำตอบถูกหรือผิด เมื่อจบบทที่ 3 คำตอบจะถูกส่งให้ทีมผู้วิจัยแบบไม่ระบุตัวตน ชื่อรหัสและหน้าตาตัวละครไม่ถูกส่ง</p>
 <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-action="closeModal">เข้าใจแล้ว</button></div>`);}
function askReset(){modal(`<h2>เริ่มภารกิจใหม่?</h2><p class="muted">คำตอบ ไอเดีย และ XP ทั้งหมดในเครื่องนี้จะถูกล้าง</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-action="closeModal">ยกเลิก</button><button class="btn primary" data-action="doReset">ล้างและเริ่มใหม่</button></div>`);}

function loadDemo(){S=fresh();S.demo=true;S.profile={style:0,skin:1,hair:1,outfit:0,color:1,codename:'ผู้เล่นตัวอย่าง',org:'ASM Company',age:'25–34 ปี',status:'พนักงานบริษัท',sim:false,gender:'หญิง',ageYears:'29',marital:'โสด',family:'3–4 คน',edu:'ปริญญาตรี',dept:'',position:'ระดับปฏิบัติการ',tenure:'1–3 ปี',distance:'11–20 กม.',commute:'รถโดยสารสาธารณะ / รถไฟฟ้า',hospital:'มากกว่า 3 ปี'};
  const tg=[2.4,2.3,3.4,2.7,2.5,2.6,3.0,3.3,3.1,3.6,3.0,2.4,2.4,3.0,3.4,2.7],nz=[-0.3,0.3];
  S.answers=DIMS.map((D,d)=>D.items.map((it,i)=>{const v=Math.min(5,Math.max(1,Math.round(tg[d]+nz[i])));return it[1]?6-v:v}));
  S.ideas={0:{text:'ปรับเงินเดือนตามผลประเมินจริงปีละ 2 ครั้ง และเปิดเผยช่วงเงินเดือนของแต่ละตำแหน่งให้พนักงานทราบ',stars:3},1:{text:'ประกาศเกณฑ์เลื่อนขั้นให้ชัด',stars:2}};
  S.sawGap=true;S.screen='ch3';}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='closeModal'){if(el.classList.contains('modal')&&e.target!==el)return;closeModal();return;}
  switch(a){
  case'start':if(S.demo){S=fresh();SUB={s:'idle'};}S.screen=profileOK()?(allReal()?'ch3':'ch2'):'avatar';render();window.scrollTo(0,0);break;
  case'demo':loadDemo();SUB={s:'demo'};render();toast('โหลดข้อมูลจำลองแล้ว');window.scrollTo(0,0);break;
  case'howto':howto();break;
  case'home':S.screen='home';render();break;
  case'askReset':askReset();break;
  case'doReset':S=fresh();SUB={s:'idle'};closeModal();render();toast('เริ่มภารกิจใหม่แล้ว');break;
  case'setP':S.profile[el.dataset.k]=+el.dataset.v;keepName();render();break;
  case'setAge':S.profile.age=el.dataset.v;keepName();render();break;
  case'setF':keepProfile();S.profile[el.dataset.k]=el.dataset.v;render();break;
  case'setOrg':keepName();keepProfile();S.profile.org=el.dataset.v;render();if(el.dataset.v===OTHER){const i=document.getElementById('orgName');if(i)i.focus();}break;
  case'setStatus':S.profile.status=el.dataset.v;keepName();keepProfile();render();break;
  case'toggleSim':keepProfile();S.profile.sim=!S.profile.sim;keepName();render();break;
  case'randNameUnused':{const a1=['นักออกแบบ','สถาปนิก','นักสำรวจ','ผู้พิทักษ์','นักบุกเบิก'],n=a1[Math.floor(Math.random()*a1.length)]+'#'+(10+Math.floor(Math.random()*90));S.profile.codename=n;render();break;}
  case'enterCity':profileEnter();break;
  case'openDist':{const d=+el.dataset.d,a5=S.answers[d].findIndex(v=>v==null);S.cur={d,q:a5<0?0:a5};S.screen='mission';render();window.scrollTo(0,0);break;}
  case'startRun':{const np=nextPos(S.pos||0);S.pos=np<0?0:np;S.screen='mission';render();window.scrollTo(0,0);break;}
  case'answer':{const pos=S.pos||0,[d,i]=ordAt(pos),v=+el.dataset.v;el.setAttribute('aria-pressed','true');
    setTimeout(()=>{const wasDone=distDone(d);let msg='';withXP(()=>{S.answers[d][i]=v;if(!wasDone&&distDone(d)){S._anim=d;msg=`สร้างชั้น ${d+1} เสร็จ`;}
      const np=nextPos(pos+1);if(np<0){S.sawGap=true;S.screen='ch3';msg='สร้างตึกครบ 16 ชั้นแล้ว';}else S.pos=np;},msg);window.scrollTo({top:0,behavior:'smooth'});},160);break;}
  case'prevQ':S.pos=Math.max(0,(S.pos||0)-1);render();break;
  case'dossier':modal(`<h2>แฟ้มข้อมูลบริษัท</h2>${dossierHTML()}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-action="closeModal">กลับไปตอบต่อ</button></div>`);break;
  case'adminLogin':adminLogin();break;
  case'adminSubmit':adminSubmit();break;
  case'adminLogout':ADMIN_OK=false;ADMIN_PASS='';if(STATS.unsub){STATS.unsub();STATS.unsub=null;}try{sessionStorage.removeItem('wt9-admin');sessionStorage.removeItem('ic-admin-pass');}catch(e){}S.screen='home';STATS.csv='';render();break;
  case'artCopy':artCopy();break;
  case'artDl':if(ART)saveFile(`ideal-company-article-${new Date().toISOString().slice(0,10)}.txt`,artText(ART),'text/plain;charset=utf-8');break;
  case'copyCode':copyCode();break;
  case'importCodes':importCodes();break;
  case'epSave':epSave();break;
  case'epClear':try{localStorage.removeItem('ic-endpoint');}catch(e){}location.reload();break;
  case'askDelete':askDelete();break;
  case'doDelete':doDelete();break;
  case'selNone':SEL.clear();render();break;
  case'tab':STATS.tab=el.dataset.t;STATS.csv='';render();break;
  case'unitSave':saveUnits();break;
  case'viewResp':if(el.dataset.id)viewResp(el.dataset.id);break;
  case'pickUnit':pickUnit(el.dataset.c,el.dataset.n);break;
  case'unitCancel':STATS.unitDraft=null;STATS.unitErr='';render();break;
  case'dl':dl(el.dataset.k);break;
  case'go':{const to=el.dataset.to;if(to==='stats'){if(!ADMIN_OK){adminLogin();break;}ensureSub();}if(to==='ch3'&&allReal()){withXP(()=>{S.sawGap=true;S.screen='ch3'});}else{saveIdeaDrafts();S.screen=to;render();}window.scrollTo({top:0,behavior:'smooth'});break;}
  case'starter':{const ta=document.getElementById('idea'+el.dataset.d);ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+el.dataset.t+' ';ta.focus();break;}
  case'submitIdea':{const d=+el.dataset.d,t=document.getElementById('idea'+d).value,st=rateIdea(t);
    if(!st){document.getElementById('res'+d).innerHTML='<span class="err">เขียนไอเดียอย่างน้อย 1 ประโยค</span>';return;}
    saveIdeaDrafts();const prev=S.ideas[d]?.stars||0;withXP(()=>{S.ideas[d]={text:t.trim(),stars:Math.max(st,prev)}},st===5?'ไอเดียระดับ 5 ดาว':'ส่งไอเดียแล้ว');break;}
  case'finish':{saveIdeaDrafts();if(!Object.values(S.ideas).some(i=>i.stars)){document.getElementById('ideaErr').hidden=false;return;}withXP(()=>{S.finished=true;S.submitted=false;S.screen='report'},'ภารกิจสำเร็จ');window.scrollTo(0,0);submit();break;}
  case'resubmit':submit();break;
  case'exportCsv':exportCsv();break;
  case'toggleSample':STATS.sample=!STATS.sample;STATS.csv='';render();break;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-action]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(e.key==='Escape')closeModal();});
document.addEventListener('input',e=>{
  if(e.target.id==='codename')S.profile.codename=e.target.value;
  if(e.target.id==='extra')S.extra=e.target.value;
  if(e.target.id==='orgName'){S.profile.orgName=e.target.value;save();}});
document.addEventListener('change',e=>{const m={fAge:'age',fOrg:'org',fStatus:'status',fMode:'mode',fGen:'generation',fGender:'gender',fPos:'position',fBoss:'bossLevel',fTenure:'tenure'}[e.target.id];if(m){STATS.f[m]=e.target.value;STATS.csv='';render();}});
function keepName(){const on=document.getElementById('orgName');if(on)S.profile.orgName=on.value;const n=document.getElementById('codename');if(n)S.profile.codename=n.value;}

function saveIdeaDrafts(){topDims().forEach(d=>{const ta=document.getElementById('idea'+d);if(ta&&S.ideas[d])S.ideas[d].text=ta.value.trim()||S.ideas[d].text;});const ex=document.getElementById('extra');if(ex)S.extra=ex.value;}
/* ---------- boot ---------- */
async function initCaps(){const c=window.claude;if(!c||!c.use){if(activeEndpoint()){DB=makeSheetDB();UID=localUid();LOCAL_ONLY=!SITE_CONFIG.ENDPOINT;}else{DB=makeLocalDB();LOCAL_ONLY=true;}if(ADMIN_OK&&S.screen==='stats')ensureSub();render();if(S.finished&&!S.demo&&!S.submitted)submit();return;}
  try{USER=await c.use('user');}catch(e){}try{DB=await c.use('db');}catch(e){}
  if(USER){try{IS_ADMIN=!!(await USER.canEdit());}catch(e){}try{UID=await USER.id();}catch(e){}}
  if(ADMIN_OK&&S.screen==='stats')ensureSub();
  render();if(S.finished&&!S.demo&&!S.submitted)submit();}
function start(data){if(data&&data.answers)S=Object.assign(fresh(),data);else load();render();initCaps();}
try{window.claude?.hot?.snapshot?.(()=>S);}catch(e){}
const hot=window.claude&&window.claude.hot;
hot&&hot.ready?hot.ready(start):start(hot&&hot.data?hot.data:{});
})();
</script>
